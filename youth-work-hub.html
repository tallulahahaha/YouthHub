<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Youth Work Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: one calm column; home = three equal doors; inner screens = back bar + content grid. Smartboard-first touch targets. */
/* Bubblegum: lilac page, white cards, hot pink accent, candy pops; ink outlines and hard sticker shadows. Unbounded display + Lexend body. */
:root{
  --sand:#F6F0FF; --card:#FFFFFF; --sage:#CDBBFF; --sage-soft:#EFE6FF;
  --euc:#E8358F; --euc-strong:#B8146A; --forest:#1B1630; --muted:#5E5679;
  --line:#E2D6FA; --on-euc:#FFFFFF; --paper:#FFFFFF; --danger:#D23A3A;
  --pop-pink:#FF4FA3; --pop-yellow:#FFE14D; --pop-teal:#2FD4C4; --pop-violet:#8C6CFF; --pop-line:#1B1630; --blob-o:.5;
  --font:'Lexend', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --display:'Unbounded', 'Lexend', ui-rounded, system-ui, sans-serif;
  --radius:24px; --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sand:#17122B; --card:#231C40; --sage:#4C3F82; --sage-soft:#2E2554;
  --euc:#FF5FAE; --euc-strong:#FF8CC6; --forest:#F6F0FF; --muted:#BCB2DC;
  --line:#3B3166; --on-euc:#1B1630; --paper:#231C40; --danger:#FF7A7A; --pop-line:#06040F; --blob-o:.22; color-scheme:dark }}
:root[data-theme="dark"]{
  --sand:#17122B; --card:#231C40; --sage:#4C3F82; --sage-soft:#2E2554;
  --euc:#FF5FAE; --euc-strong:#FF8CC6; --forest:#F6F0FF; --muted:#BCB2DC;
  --line:#3B3166; --on-euc:#1B1630; --paper:#231C40; --danger:#FF7A7A; --pop-line:#06040F; --blob-o:.22; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--sand);color:var(--forest);font-family:var(--font);font-size:calc(17px * var(--scale));line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 40px}
body.present{--scale:1.22}
.wrap{max-width:1180px;margin:0 auto}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--euc);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:500;font-size:1.05em;background:none;border:0;padding:6px 4px;border-radius:12px}
.mark{width:36px;height:36px;border-radius:12px;background:var(--euc);display:grid;place-items:center}
.mark span{width:14px;height:14px;border-radius:50%;border:3px solid var(--on-euc)}
.present-btn{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 18px 10px 12px;font-size:.95em;font-weight:500;min-height:52px}
.track{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.track::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:transform .2s}
.present-btn[aria-pressed="true"] .track{background:var(--euc)}
.present-btn[aria-pressed="true"] .track::after{transform:translateX(18px)}

/* home */
.hello{padding-block:28px 32px}
.hello h1{font-size:clamp(1.9em, 4.5vw, 2.8em);font-weight:500;letter-spacing:-.01em;margin:0;text-wrap:balance}
.hello p{margin:10px 0 0;color:var(--muted);font-size:1.05em}
body.present .hello p{display:none}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.door{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px 28px;
  display:flex;flex-direction:column;gap:14px;min-height:300px;transition:transform .18s ease, border-color .18s, box-shadow .18s}
.door:hover{transform:translateY(-3px);border-color:var(--sage);box-shadow:0 10px 30px -18px rgba(47,58,52,.45)}
.door:active{transform:translateY(0)}
.door .ico{width:64px;height:64px;border-radius:20px;background:var(--sage-soft);display:grid;place-items:center}
.door .ico svg{width:34px;height:34px;stroke:var(--euc-strong);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.door h2{font-size:1.65em;font-weight:500;margin:6px 0 0;line-height:1.15}
.door p{margin:0;color:var(--muted)}
.door .go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--euc-strong)}
.door.primary{background:var(--euc);border-color:var(--euc);color:var(--on-euc)}
.door.primary p,.door.primary .go{color:var(--on-euc);opacity:.92}
.door.primary .ico{background:rgba(255,255,255,.18)}
.door.primary .ico svg{stroke:var(--on-euc)}
body.present .door p{display:none}
body.present .door{min-height:260px}

/* inner screens */
.screen-head{display:flex;align-items:center;gap:16px;padding-block:10px 24px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:12px 22px 12px 16px;font-weight:500;min-height:52px}
.screen-head h1{margin:0;font-size:clamp(1.6em,3.6vw,2.3em);font-weight:500}
.lead{color:var(--muted);margin:-8px 0 24px;max-width:62ch}
body.present .lead{display:none}

/* starters */
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.starter{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 22px 6px;
  padding:22px 22px;font-size:1.12em;font-weight:500;min-height:110px;transition:border-color .15s, background .15s}
.starter:hover{border-color:var(--euc)}
.starter[aria-pressed="true"]{background:var(--euc);color:var(--on-euc);border-color:var(--euc)}
.guide{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px}
.guide h3{margin:0 0 14px;font-size:.82em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.guide ol{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:q}
.guide li{counter-increment:q;display:flex;gap:14px;align-items:flex-start;font-size:1.12em}
.guide li::before{content:counter(q);flex:none;width:34px;height:34px;border-radius:50%;background:var(--sage-soft);color:var(--euc-strong);display:grid;place-items:center;font-size:.8em;font-weight:600}
.tools{display:flex;flex-direction:column;gap:10px}
.tool{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--sand);border:1px solid var(--line);border-radius:16px;padding:14px 18px;font-weight:500;min-height:56px}
.tool small{font-weight:400;color:var(--muted);font-size:.78em}
.hint{color:var(--muted);font-size:.92em;margin-top:18px}

/* families */
.families{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.family{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;display:flex;flex-direction:column;gap:12px}
.family h2{margin:0;font-size:1.35em;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.92em}
.badge{align-self:flex-start;font-size:.75em;font-weight:500;letter-spacing:.04em;padding:5px 12px;border-radius:999px;background:var(--sage-soft);color:var(--euc-strong)}

/* sorted */
.sorted{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;gap:18px}
.panel h2{margin:0;font-size:1.4em;font-weight:500}
.panel p{margin:0;color:var(--muted)}
.booklet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chapter{background:var(--sand);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.chapter b{display:block;font-weight:500;margin-bottom:6px}
.chapter ul{margin:0;padding-left:18px;color:var(--muted);font-size:.9em}
.cta{align-self:flex-start;background:var(--euc);color:var(--on-euc);border:0;border-radius:999px;padding:14px 24px;font-weight:500;min-height:52px}
.resume-preview{background:var(--sand);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:10px}
.line{height:10px;border-radius:6px;background:var(--line)}
.line.w1{width:55%;height:16px;background:var(--sage)}.line.w2{width:80%}.line.w3{width:65%}.line.w4{width:90%}
.privacy{display:flex;gap:10px;align-items:center;font-size:.9em;color:var(--muted)}
.privacy svg{width:20px;height:20px;stroke:var(--euc-strong);fill:none;stroke-width:1.8;flex:none}

/* starter hero */
.hero{background:var(--euc);color:var(--on-euc);border-radius:28px;padding:30px 34px 26px;display:flex;flex-direction:column;gap:18px;margin-block:8px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.kicker{font-size:.8em;letter-spacing:.09em;text-transform:uppercase;font-weight:500;opacity:.85}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-size:.85em;font-weight:500}
.q{font-size:clamp(1.7em,4.6vw,3em);font-weight:500;line-height:1.18;margin:0;min-height:2.4em;display:flex;align-items:center;text-wrap:balance;position:relative;z-index:1;transition:opacity .22s, transform .22s}
.q.out{opacity:0;transform:translateY(10px)}
.hero-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hbtn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);color:var(--on-euc);border:0;border-radius:999px;padding:12px 18px;font-weight:500;min-height:52px}
.hbtn:hover{background:rgba(255,255,255,.26)}
.hbtn.round{width:56px;padding:0;justify-content:center}
.count{margin-left:auto;font-variant-numeric:tabular-nums;opacity:.8;font-size:.9em}
.cats{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.cat{background:transparent;color:var(--on-euc);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 16px;font-size:.88em;font-weight:500;min-height:44px}
.cat:hover{border-color:rgba(255,255,255,.7)}
.cat[aria-pressed="true"]{background:var(--on-euc);color:var(--euc-strong);border-color:var(--on-euc)}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1}
.vote{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:rgba(255,255,255,.14);color:var(--on-euc);border:1.5px solid rgba(255,255,255,.3);border-radius:18px;padding:16px 18px;min-height:72px;font-weight:500;font-size:1em}
.vote:hover{border-color:rgba(255,255,255,.7)}
.vote:active{transform:scale(.98)}
.vfill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.22);transition:width .35s ease}
.vtext,.vnum{position:relative}
.vnum{font-size:1.5em;font-variant-numeric:tabular-nums;min-width:1.4em;text-align:right}
.vmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.85em;opacity:.85;margin-top:8px;position:relative;z-index:1;min-height:32px}
.vreset{background:none;border:0;color:var(--on-euc);text-decoration:underline;font-size:1em;padding:6px}
@media (max-width:600px){.votes{grid-template-columns:1fr}}
.doors.compact .door{min-height:0;padding:22px 24px;gap:10px}
.doors.compact .door .ico{width:52px;height:52px;border-radius:16px}
.doors.compact .door h2{font-size:1.4em}
.doors.compact .door{background:var(--card);border-color:var(--line);color:var(--forest)}
.doors.compact .door p{color:var(--muted)}
.doors.compact .door .go{color:var(--euc-strong)}
.doors.compact .door .ico{background:var(--sage-soft)}
.doors.compact .door .ico svg{stroke:var(--euc-strong)}
/* focus view */
.focus .hero{min-height:calc(100vh - 190px);justify-content:space-between;padding:40px 44px 32px}
.focus .q{font-size:clamp(2em,6vw,4.2em)}
@media (max-width:600px){.hero{padding:24px 22px 20px}.count{margin-left:0;width:100%}}

/* shared bits */
.chip.live{display:inline-flex;align-items:center;gap:6px;background:var(--euc);color:var(--on-euc);border-color:var(--euc);font-weight:500}
.chip.live svg{width:16px;height:16px}
button.chip{min-height:44px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:12px 20px;font-weight:500;min-height:52px}
.ghost:hover{border-color:var(--euc)}
.ghost.danger{color:var(--danger)}
.danger-bg{background:var(--danger)!important}
a.cta{text-decoration:none;display:inline-flex;align-items:center}
.eyebrow{font-size:.78em;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--muted)}

/* flipbook */
.fb-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fb-tab{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:500;font-size:.92em;min-height:48px}
.fb-tab[aria-pressed="true"]{background:var(--euc);border-color:var(--euc);color:var(--on-euc)}
.book{perspective:1800px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px 26px 26px 10px;box-shadow:inset 14px 0 18px -14px rgba(47,58,52,.25), 0 18px 40px -28px rgba(47,58,52,.5);
  padding:clamp(22px,4vw,44px);min-height:520px;transform-origin:left center;transition:transform .22s ease, opacity .22s ease}
.sheet.turn-out{transform:rotateY(calc(var(--dir,1) * -14deg)) translateX(calc(var(--dir,1) * -24px));opacity:0}
.sheet.turn-in{transform:rotateY(calc(var(--dir,1) * 10deg)) translateX(calc(var(--dir,1) * 24px));opacity:0;transition:none}
.pg.cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;min-height:440px}
.cover-l h2{font-size:clamp(2.2em,5vw,3.4em);font-weight:500;margin:8px 0 10px;line-height:1.05}
.cover-l p{color:var(--muted);margin:0 0 24px;max-width:36ch}
.cover-r{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:c}
.cover-r li{counter-increment:c;background:var(--sand);border:1px solid var(--line);border-radius:16px;padding:16px 18px 16px 62px;position:relative}
.cover-r li::before{content:counter(c);position:absolute;left:16px;top:16px;width:32px;height:32px;border-radius:50%;background:var(--euc);color:var(--on-euc);display:grid;place-items:center;font-weight:600;font-size:.85em}
.cover-r b{display:block;font-weight:500}
.cover-r span{color:var(--muted);font-size:.88em}
.pg.doc{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:clamp(24px,4vw,48px)}
.sleeve{display:flex;flex-direction:column;gap:18px;border-right:1px dashed var(--line);padding-right:clamp(16px,3vw,36px)}
.docart{position:relative;background:var(--sage-soft);border-radius:20px;padding:28px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.docart svg{width:min(130px,60%);height:auto;fill:var(--card);stroke:var(--euc-strong);stroke-width:2.5;stroke-linecap:round}
.docart .num{position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:50%;background:var(--euc);color:var(--on-euc);display:grid;place-items:center;font-weight:600}
.doclabel{font-weight:500;text-align:center}
.needs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.needs span{width:100%;font-size:.8em;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.needs em{font-style:normal;background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88em}
.info h2{margin:0;font-size:clamp(1.6em,3.2vw,2.2em);font-weight:500}
.info .what{font-size:1.1em;margin:8px 0 18px;max-width:58ch}
.info dl{margin:0;display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:12px 22px;border-top:1px solid var(--line);padding-top:18px}
.info dt{font-weight:500;color:var(--euc-strong)}
.info dd{margin:0;max-width:62ch}
.info dd ol{margin:0;padding-left:20px;display:grid;gap:6px}
.pg-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.pg-act{display:flex;flex-direction:column;gap:6px}
.linknote,.checked{font-size:.82em;color:var(--muted)}
.fb-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:20px}
.hbtn-l{background:var(--card);border:1px solid var(--line);border-radius:999px;width:60px;height:60px;display:grid;place-items:center}
.hbtn-l:hover{border-color:var(--euc)}
.fb-count{font-weight:500;min-width:170px;text-align:center;font-variant-numeric:tabular-nums}

/* flipbook v2: Johnny's folder */
.sheet{position:relative;padding-left:clamp(48px,7vw,84px)}
.rings{position:absolute;left:clamp(14px,2.4vw,28px);top:0;bottom:0;width:22px;display:flex;flex-direction:column;justify-content:space-evenly;pointer-events:none}
.rings::before,.rings::after{content:"";display:block;width:22px;height:22px;border-radius:50%;background:var(--sand);box-shadow:inset 0 2px 3px rgba(47,58,52,.3)}
.pg.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;min-height:520px;grid-template-columns:none}
.book:has(.cover) .sheet{background:transparent;border-color:transparent;box-shadow:none;padding-left:0}
.binder{width:min(330px,78vw);aspect-ratio:3/3.9;background:var(--euc);border-radius:12px 26px 26px 12px;position:relative;
  box-shadow:inset 34px 0 0 rgba(0,0,0,.14), 0 26px 44px -26px rgba(47,58,52,.7);display:grid;place-items:center;transform:rotate(-2deg)}
.binder::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:rgba(0,0,0,.12)}
.binder-label{background:#FFFDF7;color:#2F3A34;border-radius:14px;padding:22px 26px;text-align:center;width:72%;margin-left:20px;box-shadow:0 2px 0 rgba(0,0,0,.08);transform:rotate(1deg)}
.binder-label span{display:block;font-size:1.25em;font-weight:400}
.binder-label b{display:block;font-size:2em;font-weight:600;line-height:1.1}
.cover .cta{align-self:center}
button.binder{border:0;cursor:pointer;font:inherit;padding:0;transition:transform .2s}
button.binder:hover{transform:rotate(-1deg) scale(1.02)}
.cta.big{font-size:1.1em;padding:16px 30px;min-height:60px}
.contents h2{margin:0 0 20px;font-size:clamp(1.6em,3.4vw,2.3em);font-weight:500}
.toc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.toc h3{margin:0 0 10px;font-size:.8em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.toc section{display:flex;flex-direction:column;gap:8px;min-width:0}
.toc-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;text-align:left;min-height:60px;font-weight:500;font-size:.95em}
.toc-item:hover{border-color:var(--euc)}
.toc-item em{font-style:normal;color:var(--euc-strong);margin-right:6px;font-variant-numeric:tabular-nums}
.mini{width:58px;height:auto;flex:none;background:#F3EFE6;border-radius:8px}
.pg.doc{display:grid;grid-template-columns:1fr;gap:28px}
.pg.doc:has(.detail){grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}
.doc-main{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.pocket{position:relative;width:min(400px,100%);background:#F3EFE6;border:2px solid rgba(47,58,52,.14);border-radius:18px;padding:18px 18px 10px;margin-bottom:8px;overflow:hidden}
.pocket::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.45) 42%,rgba(255,255,255,0) 54%);pointer-events:none}
.pocket .art{width:100%;height:auto;display:block}
.doc-main h2{margin:0;font-size:clamp(1.7em,3.6vw,2.4em);font-weight:500}
.tag{margin:0;font-size:1.15em;color:var(--muted)}
.age{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.age-pill{background:var(--sage-soft);color:var(--euc-strong);font-weight:600;border-radius:999px;padding:8px 18px;font-size:1.05em}
.age-note{font-size:.9em;color:var(--muted);max-width:40ch}
.toc-age{display:block;font-size:.8em;font-weight:400;color:var(--muted)}
.needs-line{margin:4px 0 0;font-size:.9em;color:var(--muted)}
.needs-line em{font-style:normal;background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin-left:4px;display:inline-block;margin-top:4px}
.doc-go{margin-top:14px}
.detail{background:var(--sand);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:16px;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.detail h3{margin:0;font-weight:500;font-size:1.25em}
.detail ol{margin:0;padding-left:22px;display:grid;gap:8px}
.facts{display:grid;gap:10px}
.facts div{display:grid;gap:2px}
.facts b{font-weight:500;color:var(--euc-strong);font-size:.9em}
.detail-foot{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:1000px){.toc{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.pg.doc:has(.detail){grid-template-columns:1fr}}
@media (max-width:520px){.toc{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.detail{animation:none}}

/* resume builder v2: step by step */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.stp{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 8px;font-weight:500;font-size:.9em;min-height:46px;color:var(--muted)}
.stp em{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-size:.85em}
.stp[aria-current="step"]{background:var(--euc);border-color:var(--euc);color:var(--on-euc)}
.stp[aria-current="step"] em{background:rgba(255,255,255,.22)}
.rb2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;align-items:start}
.rb2.solo{grid-template-columns:1fr}
.stepcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(20px,3vw,32px);display:grid;gap:18px;min-width:0}
.stepcard h2{margin:0;font-size:clamp(1.4em,2.6vw,1.8em);font-weight:500}
.stepcard h3{margin:0 0 10px;font-size:1.05em;font-weight:500}
.stepcard h3 small{font-weight:400;color:var(--muted);font-size:.85em;margin-left:6px}
.rq{display:grid;gap:8px}
.chips.col{flex-direction:column;align-items:flex-start}
.fld.inline{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;max-width:520px}
.fld.inline input{min-height:46px}
.built{background:var(--sage-soft);border-radius:18px;padding:18px 20px;display:grid;gap:8px}
.built p{margin:0;font-size:1.1em;line-height:1.55}
.built textarea{font:inherit;font-size:1.05em;color:var(--forest);background:var(--card);border:1.5px solid var(--euc);border-radius:14px;padding:12px 14px;width:100%;resize:vertical}
.built .link{justify-self:start}
.count-line{margin:0;font-weight:500;color:var(--euc-strong)}
.stmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.stmt{text-align:left;background:var(--sand);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px;min-height:76px;font-size:1em}
.stmt .say{font-weight:500}
.stmt .becomes{display:none;align-items:center;gap:6px;font-size:.88em;color:var(--on-euc)}
.stmt .becomes svg{width:16px;height:16px}
.stmt[aria-pressed="true"]{background:var(--euc);border-color:var(--euc);color:var(--on-euc)}
.stmt[aria-pressed="true"] .becomes{display:inline-flex}
.certs{display:grid;gap:8px}
.cert{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sand);border-radius:12px;padding:8px 12px}
.cert select,.fld select{font:inherit;color:var(--forest);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px}
.exp{display:grid;grid-template-columns:minmax(200px,.8fr) minmax(0,1.6fr);gap:18px;align-items:start}
.hosts{display:grid;gap:8px;align-content:start}
.host{display:flex;align-items:center;gap:12px;text-align:left;background:var(--sand);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-height:58px;cursor:grab;touch-action:none;user-select:none}
.host:hover{border-color:var(--euc)}
.host .mono{width:38px;height:38px;border-radius:12px;background:var(--sage-soft);color:var(--euc-strong);display:grid;place-items:center;font-weight:600;flex:none}
.host b{display:block;font-weight:500}
.host small{color:var(--muted)}
.host.blank{border-style:dashed;cursor:pointer}
.ghost-drag{position:fixed;z-index:50;pointer-events:none;width:240px;box-shadow:0 18px 40px -16px rgba(47,58,52,.6);transform:rotate(-3deg);background:var(--card)}
.drop{min-height:220px;border:2px dashed var(--line);border-radius:18px;padding:14px;display:grid;gap:14px;align-content:start;transition:border-color .15s, background .15s}
.drop.over{border-color:var(--euc);background:var(--sage-soft)}
.drop-empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px 10px;gap:4px}
.drop-empty i{font-size:36px;color:var(--sage)}
.drop-empty p{margin:0;font-weight:500;color:var(--forest)}
.jobc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.refs2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.refc{background:var(--sand);border-radius:18px;padding:18px;display:grid;gap:12px;min-width:0}
.refc h3{margin:0}
.asked{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:500}
.asked span{margin-right:4px}
.step-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.step-nav .ghost svg,.step-nav .cta svg{width:18px;height:18px;vertical-align:-3px}
.step-nav .cta{display:inline-flex;align-items:center;gap:8px}
.warn{margin:0;display:flex;gap:8px;align-items:center;background:var(--sand);border:1.5px solid var(--danger);color:var(--danger);border-radius:14px;padding:12px 14px;font-weight:500}
.finish-acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.finish-acts .cta,.finish-acts .ghost{display:inline-flex;align-items:center;gap:8px}
.finish-acts svg{width:18px;height:18px}
.big-paper{aspect-ratio:auto;max-width:720px;font-size:.92em}
.paper ul{margin:2px 0 6px;padding-left:18px}
.p-refs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.iv{background:var(--euc);color:var(--on-euc);border-radius:24px;padding:clamp(22px,4vw,36px);display:grid;gap:14px}
.iv .eyebrow{color:var(--on-euc);opacity:.85}
.iv-q{margin:0;font-size:clamp(1.5em,3.6vw,2.4em);font-weight:500;line-height:1.2;text-wrap:balance}
.iv-look{margin:0;display:flex;gap:8px;align-items:center;opacity:.9}
.iv-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.iv .segb{background:rgba(255,255,255,.16);color:var(--on-euc);border-color:rgba(255,255,255,.35)}
.iv .segb[aria-pressed="true"]{background:var(--on-euc);color:var(--euc-strong)}
.iv .hbtn-l{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:var(--on-euc)}
@media (max-width:1000px){.rb2{grid-template-columns:1fr}.exp{grid-template-columns:1fr}.hosts{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.hosts .eyebrow{grid-column:1/-1}}
@media (max-width:700px){.refs2{grid-template-columns:1fr}.fld.inline{grid-template-columns:1fr}.p-refs{grid-template-columns:1fr}}

/* resume builder */
.rb{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.rb-form{display:grid;gap:18px}
.rb-form fieldset{margin:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:20px 22px 22px;display:grid;gap:14px;min-width:0}
.rb-form legend{font-weight:500;font-size:1.1em;padding:0 8px;margin-left:-8px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:grid;gap:6px;min-width:0}
.fld span{font-size:.9em;font-weight:500}
.fld input,.fld textarea{font:inherit;color:var(--forest);background:var(--sand);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px;width:100%}
.fld textarea{resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--euc);box-shadow:0 0 0 3px var(--sage-soft)}
.tip{margin:0;font-size:.88em;color:var(--muted)}
.chip.pick[aria-pressed="true"]{background:var(--euc);color:var(--on-euc);border-color:var(--euc)}
.chip.add{color:var(--euc-strong)}
.job{display:grid;gap:12px;padding:14px 0;border-top:1px dashed var(--line)}
.job:first-child{border-top:0;padding-top:0}
.job-h{display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--euc-strong);text-decoration:underline;padding:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.segb{background:var(--sand);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:500;min-height:48px}
.segb[aria-pressed="true"]{background:var(--euc);border-color:var(--euc);color:var(--on-euc)}
.rb-side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:grid;gap:14px}
.paper{background:#FFFFFF;color:#1B1630;border:2.5px solid var(--pop-line);border-radius:6px;padding:30px 30px 34px;box-shadow:0 1px 0 var(--line), 0 20px 40px -26px rgba(47,58,52,.55);aspect-ratio:1/1.414;overflow:auto;font-size:.78em;line-height:1.45;position:relative}
.paper .p-name{font-size:2em;font-weight:600;margin:0}
.paper .p-contact{color:#5E6B63;margin:4px 0 0}
.paper h4{margin:16px 0 6px;font-size:.82em;letter-spacing:.08em;text-transform:uppercase;color:var(--rh,#1F3A5F);border-bottom:2px solid var(--rl,#1F3A5F);padding-bottom:3px}
.paper p{margin:0 0 4px}
.p-skills{columns:2;margin:0;padding-left:16px}
.p-job{margin-bottom:8px}.p-job b{font-weight:600}.p-job span{float:right;color:#5E6B63}
.is-ex{opacity:.5}
.exmark{position:absolute;top:12px;right:14px;font-size:.8em;font-weight:500;background:#F1EAFF;color:#6B4FD8;padding:4px 10px;border-radius:999px}
.rb-actions{display:flex;flex-wrap:wrap;gap:10px}
.confirm{background:var(--card);border:1.5px solid var(--danger);border-radius:18px;padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm p{margin:0;width:100%;font-weight:500}

@media (max-width:900px){
  .rb{grid-template-columns:1fr}
  .rb-side{position:static}
  .pg.doc,.pg.cover{grid-template-columns:1fr}
  .sleeve{border-right:0;border-bottom:1px dashed var(--line);padding:0 0 20px}
  .info dl{grid-template-columns:1fr;gap:4px}
  .info dd{margin-bottom:10px}
}
@media (max-width:520px){.row2{grid-template-columns:1fr}.paper{aspect-ratio:auto}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--forest);color:var(--sand);padding:14px 22px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:860px){
  .doors{grid-template-columns:1fr}
  .door{min-height:0}
  .guide,.sorted{grid-template-columns:1fr}
}
@media (max-width:480px){.booklet{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Bubblegum layer: candy palette, sticker tiles, microinteractions ===== */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(50px);opacity:var(--blob-o)}
.blobs i:nth-child(1){width:420px;height:420px;background:#FF8BC6;top:-120px;left:-100px;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(2){width:380px;height:380px;background:#7FE8DD;bottom:-140px;right:-80px;animation:drift 26s ease-in-out infinite alternate-reverse}
.blobs i:nth-child(3){width:300px;height:300px;background:#FFE680;top:40%;left:55%;animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(60px,-40px) scale(1.15)}}
h1,h2,.brand,.q,.iv-q,.tb-term,.binder-label b,.cover-l h2,.greet h1{font-family:var(--display);letter-spacing:-.01em}
h1,h2{font-weight:600}
.brand{font-weight:700}
.mark{background:var(--pop-pink);border:2.5px solid var(--pop-line);box-shadow:0 3px 0 var(--pop-line);transform:rotate(-6deg);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.brand:hover .mark{transform:rotate(12deg) scale(1.1)}
.mark span{border-color:#fff}

/* pressable sticker buttons */
.cta,.ghost,.back,.present-btn,.hbtn-l,.fb-tab,.stp,.tool,.toc-item,.segb{border:2px solid var(--pop-line)!important;box-shadow:0 4px 0 var(--pop-line);transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .15s}
.cta:hover,.ghost:hover,.back:hover,.present-btn:hover,.hbtn-l:hover,.fb-tab:hover,.stp:hover,.tool:hover,.toc-item:hover,.segb:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--pop-line)}
.cta:active,.ghost:active,.back:active,.present-btn:active,.hbtn-l:active,.fb-tab:active,.stp:active,.tool:active,.toc-item:active,.segb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pop-line)}
.cta{font-weight:600}
.chip{transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .15s}
button.chip:hover{transform:scale(1.06) rotate(-1deg)}
button.chip:active{transform:scale(.95)}
.chip.pick[aria-pressed="true"],.stmt[aria-pressed="true"]{animation:boop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes boop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

/* term bar */
.termbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:2.5px solid var(--pop-line);box-shadow:0 5px 0 var(--pop-line);border-radius:22px;padding:10px 12px 10px 16px;margin-bottom:22px}
.tb-term{background:var(--pop-line);color:var(--pop-yellow);border-radius:999px;padding:8px 14px;font-size:.82em;font-weight:700;white-space:nowrap}
.tb-weeks{flex:1;min-width:180px;display:flex;gap:5px}
.tb-weeks i{flex:1;height:14px;border-radius:999px;background:var(--sage-soft);border:2px solid var(--pop-line);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.tb-weeks i.done{background:var(--pop-pink)}
.tb-weeks i.now{background:var(--pop-yellow);animation:nowpulse 1.4s ease-in-out infinite}
.tb-weeks i:hover{transform:scaleY(1.5)}
@keyframes nowpulse{50%{transform:scale(1.15,1.4)}}
.tb-count{background:var(--pop-yellow);color:#1B1630;border:2.5px solid var(--pop-line)!important;border-radius:16px;padding:8px 14px;font-weight:600;transform:rotate(-3deg);box-shadow:0 4px 0 var(--pop-line);transition:transform .2s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
.tb-count b{font-family:var(--display);font-size:1.35em;margin-right:4px}
.tb-count:hover{transform:rotate(3deg) scale(1.08)}
.tb-count:active{transform:rotate(0) scale(.94)}

/* greeting */
.greet{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.greet h1{margin:0;font-size:clamp(1.7em,4vw,2.6em);font-weight:700;display:flex;align-items:baseline;gap:.3em;flex-wrap:wrap}
.crew{font:inherit;color:var(--pop-pink);background:none;border:0;border-bottom:4px dotted var(--pop-pink);padding:0;cursor:text;line-height:1.1}
.crew:hover{color:var(--pop-violet);border-color:var(--pop-violet)}
.crew-in{font:inherit;font-size:1em;color:var(--pop-pink);background:var(--card);border:2.5px solid var(--pop-line);border-radius:14px;padding:0 10px;width:8em}
.greet small{color:var(--muted)}
.wave{display:inline-block;transform-origin:70% 80%;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}

/* starter hero: colour follows the category */
.hero{--hb:#FF4FA3;--hf:#FFFFFF;background:var(--hb);color:var(--hf);border:3px solid var(--pop-line);box-shadow:0 8px 0 var(--pop-line);border-radius:30px;transition:background .45s ease,color .3s,transform .2s ease-out;overflow:clip}
.hero[data-type="Hot take"]{--hb:#FFE14D;--hf:#1B1630}
.hero[data-type="Imagine if"]{--hb:#2FD4C4;--hf:#1B1630}
.hero[data-type="About me"]{--hb:#8C6CFF;--hf:#FFFFFF}
.hero[data-type^="School crew"]{--hb:#FF8A3D;--hf:#1B1630}
.hero[data-type="Staff roast"]{--hb:#B7F046;--hf:#1B1630}
.hero::after{background:color-mix(in srgb,var(--hf) 12%,transparent);width:260px;height:260px;animation:drift 14s ease-in-out infinite alternate}
.hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:color-mix(in srgb,var(--hf) 9%,transparent)}
.hero.pop{animation:heropop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes heropop{0%{transform:scale(.97) rotate(-.6deg)}60%{transform:scale(1.015) rotate(.3deg)}100%{transform:scale(1)}}
.kicker{font-weight:700}
.pill{background:var(--hf);color:var(--hb);font-weight:700}
.q{font-weight:600;font-size:clamp(1.5em,4vw,2.6em)}
.hbtn{background:color-mix(in srgb,var(--hf) 16%,transparent);color:var(--hf);border:2px solid color-mix(in srgb,var(--hf) 40%,transparent);transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .15s}
.hbtn:hover{background:color-mix(in srgb,var(--hf) 28%,transparent);transform:translateY(-2px) scale(1.04)}
.hbtn:active{transform:scale(.92)}
.hbtn.round:hover svg{animation:nudge .4s ease}
@keyframes nudge{50%{transform:translateX(3px)}}
[data-op="next"].next-one:hover svg{animation:spin .6s ease}
.next-one{font-size:1.05em;padding:12px 22px}
@keyframes spin{to{transform:rotate(360deg)}}
.cat{color:var(--hf);border:2px solid color-mix(in srgb,var(--hf) 40%,transparent);transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .15s}
.cat:hover{transform:scale(1.07) rotate(-2deg);border-color:var(--hf)}
.cat[aria-pressed="true"]{background:var(--hf);color:var(--hb);border-color:var(--hf)}
.vote{background:color-mix(in srgb,var(--hf) 14%,transparent);color:var(--hf);border:2.5px solid color-mix(in srgb,var(--hf) 45%,transparent);transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.vote:hover{transform:translateY(-3px) rotate(-.6deg);border-color:var(--hf)}
.vote:active{transform:scale(.95)}
.vfill{background:color-mix(in srgb,var(--hf) 26%,transparent);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.vnum{font-family:var(--display);font-weight:700}
.vnum.bump{animation:bump .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.6) rotate(-8deg)}}
.vreset,.count{color:var(--hf)}

/* doors: three candy stickers */
.doors.compact{gap:20px}
.doors.compact .door{border:3px solid var(--pop-line);box-shadow:0 7px 0 var(--pop-line);color:#1B1630;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.doors.compact .door[data-go="talk"]{background:#2FD4C4}

/* wand tap: shimmer sweep, glow ring and glitter on any button */
.shine-fx{position:fixed;pointer-events:none;z-index:85;overflow:hidden;animation:ringglow .7s ease-out forwards}

.shine-fx::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--cx) var(--cy),rgba(255,255,255,.7),transparent 55%);animation:fadeout .5s ease-out forwards}
@keyframes sweep{to{transform:translateX(70%)}}
@keyframes fadeout{to{opacity:0}}
@keyframes ringglow{0%{box-shadow:0 0 0 0 rgba(255,79,163,.6),0 0 0 0 rgba(255,225,77,.5)}100%{box-shadow:0 0 0 12px rgba(255,79,163,0),0 0 22px 18px rgba(255,225,77,0)}}
.glit{position:fixed;pointer-events:none;z-index:86;width:var(--s);height:var(--s);transform:translate(-50%,-50%) scale(0);animation:twinkle var(--d) cubic-bezier(.3,1.6,.5,1) var(--delay) forwards}

/* ===== Portfolio as a real book ===== */
.book{perspective:2600px;display:flex;justify-content:center;padding:10px 0 18px}
.spread{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;max-width:1120px;min-height:600px;transition:transform .7s cubic-bezier(.45,.05,.25,1)}
.spread.is-cover{transform:translateX(-25%)}
.spread.is-cover > .pg-l{visibility:hidden}
.page{position:relative;background:var(--paper);padding:clamp(20px,3vw,40px) clamp(20px,3vw,38px) 54px;border:2.5px solid var(--pop-line);overflow:hidden;min-width:0;
  background-image:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--pop-violet) 7%,transparent) 31px 32px)}
.pg-l{border-radius:22px 3px 3px 22px;border-right-width:1px;
  box-shadow:inset -34px 0 34px -28px rgba(27,22,48,.38),-4px 4px 0 -1px var(--paper),-4px 4px 0 1px var(--pop-line),-8px 8px 0 -1px var(--paper),-8px 8px 0 1px var(--pop-line),-8px 14px 0 1px var(--pop-line)}
.pg-r{border-radius:3px 22px 22px 3px;border-left-width:1px;
  box-shadow:inset 34px 0 34px -28px rgba(27,22,48,.38),4px 4px 0 -1px var(--paper),4px 4px 0 1px var(--pop-line),8px 8px 0 -1px var(--paper),8px 8px 0 1px var(--pop-line),8px 14px 0 1px var(--pop-line)}
.pnum{position:absolute;bottom:16px;font-family:var(--display);font-size:.8em;color:var(--muted)}
.pg-l .pnum{left:70px}.pg-r .pnum{right:70px}
/* cover and inside cover */
.page.cover-r{background:var(--pop-pink);background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.25) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.2) 0 2px,transparent 3px);background-size:46px 46px,58px 58px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;border-left-width:2.5px;border-radius:8px 26px 26px 8px;
  box-shadow:inset 22px 0 0 rgba(27,22,48,.18),inset 25px 0 0 rgba(255,255,255,.25),6px 6px 0 -1px var(--paper),6px 6px 0 1px var(--pop-line),6px 14px 0 1px var(--pop-line)}
.cv-label{background:#FFFFFF;color:#1B1630;border:3px solid var(--pop-line);box-shadow:0 7px 0 var(--pop-line);border-radius:22px;padding:26px 34px;text-align:center;transform:rotate(-3deg);display:grid;gap:4px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}

.cv-star.s1{top:12%;left:14%}.cv-star.s2{top:18%;right:16%;font-size:26px;animation-delay:-1.3s;color:#2FD4C4}.cv-star.s3{bottom:14%;right:22%;font-size:40px;animation-delay:-2.4s}
@keyframes twirl{50%{transform:rotate(25deg) scale(1.2)}}
.page.endp{background:var(--pop-violet);background-image:radial-gradient(rgba(255,255,255,.28) 2px,transparent 2.5px);background-size:22px 22px;display:grid;place-items:center}

/* page content */
.contents h2{margin:4px 0 18px;font-size:clamp(1.4em,2.6vw,2em)}

/* page corners you can grab */
.corner{position:absolute;bottom:0;width:58px;height:58px;border:0;background:none;padding:0;z-index:2}
.corner span{position:absolute;bottom:0;width:30px;height:30px;transition:width .25s cubic-bezier(.3,1.6,.5,1),height .25s cubic-bezier(.3,1.6,.5,1);border:2px solid var(--pop-line)}

.corner:hover span{width:48px;height:48px}
/* the turning leaf: a bending page made of thin strips, posed every frame */
.leaf2{position:absolute;top:0;bottom:0;width:50%;z-index:6;transform-style:preserve-3d;pointer-events:none}
.leaf2.next{left:50%}.leaf2.prev{left:0}

.sf{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}

.cast-clip.l{left:0}.cast-clip.r{left:50%}
.cast{position:absolute;top:0;bottom:0;width:110px;opacity:0}
.cast.toR{background:linear-gradient(90deg,rgba(27,22,48,.5),rgba(27,22,48,.18) 35%,transparent)}
.cast.toL{background:linear-gradient(270deg,rgba(27,22,48,.5),rgba(27,22,48,.18) 35%,transparent)}
.corner{touch-action:none}
.book.dragging,.book.dragging *{cursor:grabbing!important;user-select:none}
.spread.flipin{animation:flipin .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes flipin{0%{transform:perspective(1200px) rotateY(-24deg) scale(.96);opacity:.4}100%{transform:none;opacity:1}}

body.bf-open .bf-btn{display:none}

function voteOptions(q){
  if(!/^Would you rather /i.test(q)) return null;
  let body = q.replace(/^Would you rather /i,'').replace(/\?\s*$/,'');
  const cut = body.lastIndexOf(' or ');
  if(cut<0) return null;
  const clean = s => s.replace(/,\s*$/,'').replace(/^\s*,/,'').trim();
  let a = clean(body.slice(0,cut)), b = clean(body.slice(cut+4));
  b = b.replace(/,\s*forever$/,'');
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  return [cap(a), cap(b)];
}

/* Random order without repeats: a shuffled bag, refilled when empty. Back steps through what's been shown. */
let bag=[], seen=[];
function refillBag(){ bag=OPENERS.map((o,i)=>i).filter(i=>i!==opener); for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];} }
function step(n){
  if(n<0){ if(!seen.length){toast("That's the first one");return} flip(seen.pop()); return; }
  if(!bag.length) refillBag(); seen.push(opener); if(seen.length>50) seen.shift(); flip(bag.pop());
}
function shuffleCard(){ step(1); }

/* ---------- Term bar and holiday countdown ---------- */
/* NSW public schools, Eastern division student days (education.nsw.gov.au calendars). Update yearly. */
const TERMS = [
 {t:1,s:"2026-02-02",e:"2026-04-02"},{t:2,s:"2026-04-22",e:"2026-07-03"},{t:3,s:"2026-07-21",e:"2026-09-25"},{t:4,s:"2026-10-13",e:"2026-12-17"},
 {t:1,s:"2027-02-03",e:"2027-04-09"},{t:2,s:"2027-04-29",e:"2027-07-02"},{t:3,s:"2027-07-20",e:"2027-09-24"},{t:4,s:"2027-10-11",e:"2027-12-17"}
];
const DAY = 864e5;
const ld = iso => { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); };
const today0 = () => { const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const monday = d => { const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const daysBetween = (a,b) => Math.round((b-a)/DAY);
const fmt = d => d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
function schoolDays(a,b){ let n=0; for(let d=new Date(a); d<=b; d.setDate(d.getDate()+1)){ const w=d.getDay(); if(w>0&&w<6) n++; } return n; }
let tbMode = 0;
function termInfo(){
  const now=today0();
  const cur=TERMS.find(x=>now>=ld(x.s)&&now<=ld(x.e));
  if(cur){ const s=ld(cur.s), e=ld(cur.e);
    return {inTerm:true,term:cur.t,week:Math.floor(daysBetween(monday(s),monday(now))/7)+1,weeks:Math.floor(daysBetween(monday(s),monday(e))/7)+1,days:daysBetween(now,e),school:schoolDays(now,e),last:e}; }
  const next=TERMS.find(x=>ld(x.s)>now);
  return next ? {inTerm:false,next:ld(next.s),days:daysBetween(now,ld(next.s)),term:next.t} : null;
}
function renderTermbar(){
  const el=document.getElementById('termbar'); if(!el) return;
  const T=termInfo(); if(!T){ el.innerHTML=''; return; }
  if(!T.inTerm){
    el.innerHTML=`<div class="termbar"><span class="tb-term">Holidays!</span><div class="tb-weeks" aria-hidden="true">${'<i class="done"></i>'.repeat(10)}</div>
     <button class="tb-count" data-tb>${T.days===1?'Back tomorrow':`<b>${T.days}</b> days of holidays left`}</button></div>`;
    return;
  }
  const label = T.days===0 ? 'Last day of term!' :
    tbMode===0 ? `<b>${T.days}</b> ${T.days===1?'day':'days'} till holidays!` :
    tbMode===1 ? `<b>${T.school}</b> school ${T.school===1?'day':'days'} to go` :
                 `Last day: ${fmt(T.last)}`;
  el.innerHTML=`<div class="termbar" role="group" aria-label="Term progress">
    <span class="tb-term">Term ${T.term} · Week ${T.week}</span>
    <div class="tb-weeks" role="img" aria-label="Week ${T.week} of ${T.weeks}">${Array.from({length:T.weeks},(_,i)=>`<i class="${i+1<T.week?'done':i+1===T.week?'now':''}" title="Week ${i+1}"></i>`).join('')}</div>
    <button class="tb-count" data-tb aria-label="Countdown. Tap to switch view">${label}</button></div>`;
}

/* ---------- Confetti ---------- */
const CF_COLS=['#FF4FA3','#FFE14D','#2FD4C4','#8C6CFF','#FF8A3D','#B7F046'];
function confetti(x,y,n=18){
  if(document.body.classList.contains('bf-open')) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let i=0;i<n;i++){
    const c=document.createElement('span'); c.className='cf';
    const a=Math.random()*Math.PI*2, d=60+Math.random()*120;
    c.style.left=x+'px'; c.style.top=y+'px'; c.style.background=CF_COLS[i%CF_COLS.length];
    c.style.setProperty('--dx',Math.cos(a)*d+'px'); c.style.setProperty('--dy',(Math.sin(a)*d+60)+'px'); c.style.setProperty('--r',(Math.random()*720-360)+'deg');
    if(i%3===0) c.style.borderRadius='50%';
    document.body.appendChild(c); setTimeout(()=>c.remove(),950);
  }
}

/* ---------- Gentle 3D tilt on the starter card (mouse and pen only) ---------- */
document.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const h=e.target.closest?.('.hero'); document.querySelectorAll('.hero').forEach(x=>{ if(x!==h) x.style.transform=''; });
  if(!h||document.getElementById('app').classList.contains('focus')) return;
  const r=h.getBoundingClientRect(), px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
  h.style.transform=`perspective(1200px) rotateX(${(-py*3).toFixed(2)}deg) rotateY(${(px*4).toFixed(2)}deg)`;
});
document.addEventListener('pointerleave',()=>document.querySelectorAll('.hero').forEach(x=>x.style.transform=''),true);


/* ---------- Fairy wand sparkle trail (mouse and pen only) ---------- */
const SPARK_COLS=['#FF4FA3','#FFE14D','#2FD4C4','#8C6CFF','#FFFFFF'];
const SPARK_CH=['✦','✧','⋆','✦','•'];

function spark(x,y,opts={}){
  if(document.body.classList.contains('bf-open')||document.body.classList.contains('tone-focus')) return;
  if(liveSparks>60) return;
  const s=document.createElement('span'); s.className='spark'; s.setAttribute('aria-hidden','true');
  s.textContent=SPARK_CH[Math.floor(Math.random()*SPARK_CH.length)];
  s.style.left=x+'px'; s.style.top=y+'px'; s.style.color=SPARK_COLS[Math.floor(Math.random()*SPARK_COLS.length)];
  const spread=opts.spread||16;
  s.style.setProperty('--dx',(Math.random()*2-1)*spread+'px'); s.style.setProperty('--dy',(opts.up?-1:1)*(8+Math.random()*spread*1.6)+'px');
  s.style.setProperty('--r',(Math.random()*360-180)+'deg'); s.style.setProperty('--sz',(9+Math.random()*(opts.big?14:8))+'px');
  const d=.6+Math.random()*.5; s.style.setProperty('--d',d+'s');
  document.body.appendChild(s); liveSparks++; setTimeout(()=>{s.remove();liveSparks--;},d*1000+50);
}
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||calm()) return;
  const t=performance.now(); if(t-lastSpark<28||Math.hypot(e.clientX-lx,e.clientY-ly)<7) return;
  lastSpark=t; lx=e.clientX; ly=e.clientY; spark(e.clientX-3,e.clientY-2);
});
document.addEventListener('pointerdown',e=>{
  if(calm()) return;
  for(let i=0;i<10;i++) spark(e.clientX-3,e.clientY-2,{spread:38,big:true,up:i%2===0});
});

/* ---------- Wand tap: buttons glitter and shimmer ---------- */
const GLIT_COLS=['#FFE14D','#FF4FA3','#2FD4C4','#FFFFFF','#8C6CFF','#FFC93D'];
const starSvg=c=>`<svg viewBox="0 0 20 20"><path d="M10 0 C11 7 13 9 20 10 C13 11 11 13 10 20 C9 13 7 11 0 10 C7 9 9 7 10 0Z" fill="${c}" stroke="#1B1630" stroke-width=".8"/></svg>`;
function shimmer(el,e){
  if(calm()||document.body.classList.contains('bf-open')||document.body.classList.contains('tone-focus')) return;
  const r=el.getBoundingClientRect(); if(r.width<8||r.height<8) return;
  const fx=document.createElement('div'); fx.className='shine-fx'; fx.setAttribute('aria-hidden','true');
  fx.style.left=r.left+'px'; fx.style.top=r.top+'px'; fx.style.width=r.width+'px'; fx.style.height=r.height+'px';
  fx.style.borderRadius=getComputedStyle(el).borderRadius;
  fx.style.setProperty('--cx',(e.clientX-r.left)+'px'); fx.style.setProperty('--cy',(e.clientY-r.top)+'px');
  document.body.appendChild(fx); setTimeout(()=>fx.remove(),750);
  const n=Math.min(22, 10+Math.round((r.width+r.height)/40));
  for(let i=0;i<n;i++){
    const g=document.createElement('span'); g.className='glit'; g.setAttribute('aria-hidden','true');
    const p=(i/n)*2*(r.width+r.height); let x,y,nx,ny;
    if(p<r.width){x=r.left+p;y=r.top;nx=0;ny=-1}
    else if(p<r.width+r.height){x=r.right;y=r.top+(p-r.width);nx=1;ny=0}
    else if(p<2*r.width+r.height){x=r.right-(p-r.width-r.height);y=r.bottom;nx=0;ny=1}
    else{x=r.left;y=r.bottom-(p-2*r.width-r.height);nx=-1;ny=0}
    const out=10+Math.random()*22;
    g.style.left=x+'px'; g.style.top=y+'px';
    g.style.setProperty('--dx',(nx*out+(Math.random()*12-6))+'px'); g.style.setProperty('--dy',(ny*out+(Math.random()*12-6))+'px');
    g.style.setProperty('--s',(7+Math.random()*10)+'px'); g.style.setProperty('--d',(.5+Math.random()*.4)+'s'); g.style.setProperty('--delay',(Math.random()*.12)+'s');
    g.innerHTML=starSvg(GLIT_COLS[i%GLIT_COLS.length]);
    document.body.appendChild(g); setTimeout(()=>g.remove(),1150);
  }
}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('button,a[href],.host,[data-crew]'); if(!el||el.disabled) return;
  shimmer(el,e);
});

function lvmTargets(){
  const vis=n=>lvmVisible(n);

  const span=n=>{ const ks=n.kids.filter(k=>vis(k)&&!shared(k)); const s=ks.reduce((a,k)=>a+span(k),0)+LVM_GY*Math.max(0,ks.length-1); return n.span=Math.max(n.h,s); };
  const hide=(n,x,y)=>{ n.tx=x; n.ty=y; n.kids.forEach(k=>hide(k,x,y)); };
  const place=(n,cx,cy,sg)=>{ n.tx=cx; n.ty=cy; const ks=n.kids.filter(k=>vis(k)&&!shared(k));
    n.kids.filter(k=>!vis(k)&&!shared(k)).forEach(k=>hide(k,cx,cy));
    if(!ks.length) return;
    let y=cy-(ks.reduce((a,k)=>a+k.span,0)+LVM_GY*(ks.length-1))/2;
    ks.forEach(k=>{ place(k, cx+sg*(n.w/2+LVM_GX+k.w/2), y+k.span/2, sg); y+=k.span+LVM_GY; }); };
  const r=LVM.by.root; r.tx=0; r.ty=0;
  r.kids.forEach(k=>{ if(!vis(k)) return hide(k,0,0); span(k);
    if(k.side==='R') place(k, r.w/2+LVM_GX*1.3+k.w/2, 0, 1);
    else if(k.side==='L') place(k, -(r.w/2+LVM_GX*1.3+k.w/2), 0, -1);
    else place(k, 0, r.h/2+LVM_GX+k.h/2, 1); });

    if(!ps.length){ const p=n.links[0].p; return hide(n,p.tx,p.ty); }
    span(n); place(n, Math.max(...ps.map(p=>p.tx+p.w/2))+LVM_GX+n.w/2, ps.reduce((a,p)=>a+p.ty,0)/ps.length, 1); });
}

function skClick(e){
  const k=e.target.closest('[data-sk-skill]'); if(k){ SK.skill=+k.dataset.skSkill; SK.at='q'; SK.qi=0; SK.ans=[]; skRedraw(); return true; }
  const a=e.target.closest('[data-sk-a]'); if(a){ const v=a.dataset.skA; SK.ans[SK.qi]=v; SK.ans.length=SK.qi+1;
    if(v==='yes'&&SK.qi<8){ SK.qi++; skRedraw(); return true; }
    SK.at = skNext()>0 ? 'prove' : 'next'; skRedraw(SK.at==='next'); return true; }
  if(e.target.closest('[data-sk-back]')){ SK.qi=Math.max(0,SK.qi-1); SK.ans.length=SK.qi; skRedraw(); return true; }
  if(e.target.closest('[data-sk-restart]')){ SK.at='pick'; SK.skill=-1; SK.ans=[]; skRedraw(); return true; }
  const st=e.target.closest('[data-sk-start]'); if(st){ const ta=document.getElementById('sk-ev'); SK.evidence=(SK.evidence.trim()?SK.evidence.trim()+' ':'')+st.dataset.skStart+' '; ta.value=SK.evidence; ta.focus(); return true; }
  const g=e.target.closest('[data-sk-go]'); if(g){ if(g.hasAttribute('data-sk-skip')) SK.evidence=''; SK.at=g.dataset.skGo; if(SK.at==='ideas'){SK.discard=-1;SK.star=-1;} skRedraw(SK.at==='next'); return true; }
  const bn=e.target.closest('[data-sk-bin]'); if(bn){ const i=+bn.dataset.skBin; SK.discard = SK.discard===i ? -1 : i; if(SK.star===SK.discard) SK.star=-1; skRedraw(); return true; }
  const sr=e.target.closest('[data-sk-star]'); if(sr){ SK.star=+sr.dataset.skStar; skRedraw(); return true; }
  if(e.target.closest('[data-sk-lock]')){ if(SK.discard<0){toast('Bin one idea first');return true} if(SK.star<0){toast('Now star your favourite');return true} SK.at='done'; skRedraw(true); return true; }
  const p=e.target.closest('[data-sk-pdf]'); if(p){ skDownload(p.dataset.skPdf); return true; }
  if(e.target.closest('[data-sk-new]')){ SK=skBlank(); skRedraw(); toast('Cleared. Ready for the next student.'); return true; }
  return false;
}
function skInput(e){ if(e.target.id==='sk-name'){SK.name=e.target.value;return true} if(e.target.id==='sk-ev'){SK.evidence=e.target.value;return true} return false; }

const hexRgb2 = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function skPdfBase(){
  const { jsPDF } = window.jspdf; const d=new jsPDF({unit:'mm',format:'a4'});
  const S={d,L:18,W:174,y:20,ink:[27,22,48],grey:[94,86,121]};
  S.need=h=>{ if(S.y+h>282){ d.addPage(); S.y=20; } };
  S.text=(t,o={})=>{ d.setFont('helvetica',o.b?'bold':'normal'); d.setFontSize(o.s||10.5); d.setTextColor(...(o.c||S.ink));
    d.splitTextToSize(String(t),o.w||S.W).forEach(l=>{ S.need(5.6); d.text(l,o.x||S.L,S.y); S.y+=(o.s||10.5)*0.48; }); S.y+=o.gap??1.5; };
  S.h=(t,col)=>{ S.need(14); S.y+=3; d.setFont('helvetica','bold'); d.setFontSize(11); d.setTextColor(...(col||[107,79,216])); d.text(t.toUpperCase(),S.L,S.y); S.y+=2; d.setDrawColor(...(col||[107,79,216])); d.setLineWidth(.5); d.line(S.L,S.y,S.L+S.W,S.y); S.y+=6; };
  S.path=()=>{ S.need(26); const n=skNext(); const y=S.y+6;
    for(let i=0;i<9;i++){ const b=Math.floor(i/3), x=S.L+8+i*19.5+b*4, col=hexRgb2(SK_BANDS[b].c), a=SK.ans[i];
      d.setDrawColor(...col); d.setLineWidth(1.2);
      if(a==='yes'){ d.setFillColor(...col); d.circle(x,y,4.2,'FD'); } else if(a==='sometimes'){ d.setFillColor(...hexRgb2(SK_BANDS[b].soft)); d.circle(x,y,4.2,'FD'); } else { d.setFillColor(255,255,255); d.circle(x,y,4.2,'FD'); }
      if(i===n){ d.setDrawColor(27,22,48); d.setLineWidth(.6); d.circle(x,y,6.2,'S'); d.setFont('helvetica','bold'); d.setFontSize(8); d.setTextColor(27,22,48); d.text('NEXT',x,y+11,{align:'center'}); }
    }
    d.setFont('helvetica','normal'); d.setFontSize(8); d.setTextColor(...S.grey);
    [0,1,2].forEach(b=>d.text(SK_BANDS[b].n.toUpperCase(),S.L+8+(b*3+1)*19.5+b*4,y-7,{align:'center'}));
    S.y+=24; };
  return S;
}
function skStudentPdf(){
  const S=skPdfBase(), d=S.d, n=skNext(), ideas=skIdeas(), keep=[0,1,2].filter(i=>i!==SK.discard).sort((a,b)=>(b===SK.star)-(a===SK.star));
  d.setFillColor(255,79,163); d.roundedRect(S.L,12,S.W,26,6,6,'F');
  d.setFont('helvetica','bold'); d.setFontSize(22); d.setTextColor(255,255,255); d.text('My skill snapshot',S.L+8,27);
  d.setFontSize(10); d.setFont('helvetica','normal'); d.text(`${SK.name||''}${SK.name?'  ·  ':''}${new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})}`,S.L+8,34);
  S.y=50; S.text(skName(SK.skill),{b:true,s:17,gap:0}); S.text(skSkill().fam,{c:S.grey}); S.path();
  S.h("Where I'm at"); S.text(skStageLabel(n-1),{b:true}); if(n>0) S.text(skSkill().st[n-1]);
  if(SK.evidence.trim()){ S.h("My proof"); S.text(`"${SK.evidence.trim()}"`); }

  S.y+=6; S.text('Keep this in your portfolio. Check back in when you feel ready for the next step.',{c:S.grey,s:9.5});
  return d.output('blob');
}
function skTeacherPdf(){

  S.y+=2; row('Review date',''); row('Signed','');

async function saveBlob(blob, filename){
  try{ if(downloadsNS===undefined) downloadsNS = window.claude?.use ? await window.claude.use('downloads') : null; }catch(e){ downloadsNS=null; }
  if(downloadsNS){
    try{ await downloadsNS.save({filename,data:blob}); return true; }
    catch(err){ toast(err && err.code==='declined' ? 'Download cancelled' : "Couldn't download here. Try again in a moment."); return false; }
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000); return true;
}
async function skDownload(kind){
  if(!window.jspdf){toast("The PDF maker didn't load. Check the internet connection and try again.");return}
  const who=(SK.name||'Student').replace(/[^\w\s-]/g,'').trim()||'Student';
  const ok = await saveBlob(kind==='teacher'?skTeacherPdf():skStudentPdf(), `${who} skill check-in${kind==='teacher'?' (teacher copy)':''}.pdf`);
  if(ok) toast(kind==='teacher'?'Teacher copy saved. Print it, then delete it from this computer.':'Snapshot saved. Print it for the portfolio.');
}

    <div class="qt-nav"><button class="ghost" data-at="prevq">Back</button><button class="ghost" data-at="nextq">${AT.qi>=15?'See scoring':'Skip'}</button></div>`; }
  if(sc==='score'){ const answered=AT.ans.filter(v=>v!==null).length;

    <div class="at-doms">${['A','B','C','D'].map(k=>{ const d=AT_DOM[k], neg=k<'C', on=prim===k; return `<div class="at-dom${on?' on':''}" style="--dc:${neg?'#0d8f86':'#ef6c4d'}"><div class="at-domh"><b>${k}</b><span>${d.reinf}</span><strong>${s[k]}/16</strong></div><div class="at-bar"><i style="width:${Math.round(s[k]/16*100)}%"></i></div><p>${esc(d.desc)}</p><small>${esc(d.examples)}</small></div>`; }).join('')}</div>
    <p class="at-prim"><b>Primary function:</b> ${prim?prim+': '+esc(AT_DOM[prim].desc):'Answer some questions to see the primary function.'}</p>
    ${answered&&answered<16?`<p class="qt-note">Only ${answered} of 16 answered. If the student couldn't complete them all, use the average for each domain based on the questions answered (A ${n.A?(s.A/n.A).toFixed(1):'–'}, B ${n.B?(s.B/n.B).toFixed(1):'–'}, C ${n.C?(s.C/n.C).toFixed(1):'–'}, D ${n.D?(s.D/n.D).toFixed(1):'–'}).</p>`:''}`+nav('q','break','Continue'); }

  if(sc==='wheel') return `<span class="eyebrow">Part 2 of 3</span><h2 class="qt-q">Wellbeing wheel</h2><p class="qt-sub">How much do you agree with these statements? Tap a ring on each spoke. 1 is the middle, 5 is the rim.</p>

function attendHTML(){
  const st=AT_STEP[AT.screen]??0;
  return head("My attendance") + `<div class="pb at">
    <div class="pb-top"><div class="pb-steps">${["Start","Part 1","Break","Part 2","Part 3","Done"].map((n,i)=>`<span class="${i<st?'done':i===st?'now':''}"><i>${i<st?'✓':i+1}</i>${n}</span>`).join('')}</div>
      ${AT.screen!=='break'?'<button class="pb-pause" data-at="pause">❚❚ Take a break</button>':''}</div>
    <div class="qt-body">${atScreenHTML()}</div></div>`;
}
function atRender(top){ const y=scrollY; app.innerHTML=attendHTML(); window.scrollTo({top:top?0:y}); }
function atClick(e){
  const g=e.target.closest('[data-at-go]'); if(g){ const sc=g.dataset.atGo; if(sc==='q') AT.qi=AT.screen==='score'?15:0; AT.resume=null; AT.screen=sc; atRender(true); return true; }
  const md=e.target.closest('[data-at-mood]'); if(md){ const i=+md.dataset.atMood; AT.mood=AT.mood===i?-1:i; atRender(); return true; }
  const an=e.target.closest('[data-at-ans]'); if(an){ AT.ans[AT.qi]=+an.dataset.atAns; atRender(); const q=AT.qi; setTimeout(()=>{ if(AT.screen!=='q'||AT.qi!==q) return; if(q>=15){ AT.screen='score'; atRender(true); } else { AT.qi=q+1; atRender(); } },220); return true; }
  const w=e.target.closest('[data-at-wheel]'); if(w){ const [i,sc]=w.dataset.atWheel.split('|').map(Number); AT.wheel[i]=AT.wheel[i]===sc?0:sc; atRender(); return true; }
  const mb=e.target.closest('[data-at-mb]'); if(mb){ const m=AT_MB[+mb.dataset.atMb]; AT.mb[m]=(AT.mb[m]||0)===AT.mbMode?0:AT.mbMode; atRender(); return true; }
  const b=e.target.closest('[data-at]'); if(b){ const a=b.dataset.at;
    if(a==='pause'){ AT.resume=AT.screen; AT.screen='break'; atRender(true); }
    if(a==='unpause'){ AT.screen=AT.resume||'wheel'; AT.resume=null; atRender(true); }
    if(a==='prevq'){ if(AT.qi===0) AT.screen='p1intro'; else AT.qi--; atRender(); }
    if(a==='nextq'){ if(AT.qi>=15) AT.screen='score'; else AT.qi++; atRender(AT.screen==='score'); }
    if(a==='clearwheel'){ AT.wheel=Array(8).fill(0); AT.wnotes=Array(8).fill(''); atRender(); }
    if(a==='mot'){ AT.mbMode=1; atRender(); } if(a==='bar'){ AT.mbMode=2; atRender(); }
    if(a==='restart'){ atReset(); atRender(true); toast("All cleared. Nothing was saved."); }
    if(a==='pdf') atPdf();
    return true; }
  return false;
}
document.addEventListener('input',e=>{ if(current!=='attend') return; const k=e.target.dataset&&e.target.dataset.atIn; if(!k) return; if(k.startsWith('wnote|')) AT.wnotes[+k.split('|')[1]]=e.target.value; else AT[k]=e.target.value; });
function atPdf(){
  if(!window.jspdf){ toast("The PDF maker didn't load. Check the internet connection and try again."); return; }
  const S=skPdfBase(), d=S.d, T=[13,143,134], {s}=atScores(), prim=atPrimary(), name=AT.student.trim();
  d.setFont('helvetica','bold'); d.setFontSize(9.5); d.setTextColor(...S.ink); d.text('CALDERA SCHOOL',S.L,16); d.setFont('helvetica','normal'); d.setTextColor(...S.grey); d.text('Attendance & Wellbeing Survey',S.L+S.W,16,{align:'right'});
  d.setDrawColor(...S.ink); d.setLineWidth(.7); d.line(S.L,19,S.L+S.W,19);
  S.y=31; S.text(`${name||'Student'}: attendance and wellbeing report`,{b:true,s:19,gap:3});
  [['Student',name||'–'],['Date',AT.date||'–'],['Interviewer',AT.interviewer.trim()||'–'],['Attendance',AT.att.trim()?AT.att.trim()+'%':'–'],['Mood on the day',AT.mood>=0?AT_MOODS[AT.mood][0]:'–']].forEach(([k,v])=>{ S.need(6); d.setFont('helvetica','normal'); d.setFontSize(10); d.setTextColor(...S.grey); d.text(k,S.L,S.y); d.setFont('helvetica','bold'); d.setTextColor(...S.ink); d.text(String(v),S.L+42,S.y); S.y+=5.6; });
  S.h('Summary',T); atBlurb().forEach(p=>S.text(p,{gap:3}));
  S.h('Part 1 · School attendance',T);
  AT_QS.forEach((q,i)=>{ const a=AT.ans[i]; S.text(`${i+1}. ${q[0]}`,{s:9.5,gap:0}); S.text(`${q[1]}  ·  ${a===null?'–':AT_SCALE[a]+' ('+a+')'}`,{s:9.5,b:true,c:T,gap:1.8}); });
  S.h('Scoring',T);
  ['A','B','C','D'].forEach(k=>{ S.text(`${k}  ${AT_DOM[k].reinf}  ·  ${s[k]}/16`,{b:true,gap:0}); S.text(AT_DOM[k].desc,{s:9.5,c:S.grey}); });
  S.text(`Primary function: ${prim?prim+': '+AT_DOM[prim].desc:'not identified'}`,{b:true});
  S.h('Part 2 · Wellbeing wheel',T);
  AT_SPOKES.forEach((t,i)=>{ S.need(8); const c=hexRgb2(AT_SCOL[i]); d.setFont('helvetica','normal'); d.setFontSize(10); d.setTextColor(...S.ink); d.text(`${i+1}. ${t}`,S.L,S.y);
    for(let k=1;k<=5;k++){ const x=S.L+112+(k-1)*8; d.setDrawColor(...c); d.setLineWidth(.4); if(k<=AT.wheel[i]){ d.setFillColor(...c); d.roundedRect(x,S.y-3.6,6.5,4.6,1,1,'FD'); } else d.roundedRect(x,S.y-3.6,6.5,4.6,1,1,'S'); }
    d.setFont('helvetica','bold'); d.text(String(AT.wheel[i]||'–'),S.L+S.W,S.y,{align:'right'}); S.y+=5.2;
    if(AT.wnotes[i].trim()) S.text(AT.wnotes[i].trim(),{s:9,c:S.grey,x:S.L+5,w:S.W-5}); });
  S.h('Part 3 · Motivators and barriers',T);
  AT_FUNCS.forEach(([l,sg,f,a])=>S.text(`${l} (${sg})  ${f}${a?'. '+a:''}`,{s:9.5,b:prim===l}));
  const mot=AT_MB.filter(m=>AT.mb[m]===1), bar=AT_MB.filter(m=>AT.mb[m]===2);
  S.text('Motivators',{b:true,gap:0}); S.text(mot.length?mot.join(', '):'None marked.');
  S.text('Barriers',{b:true,gap:0}); S.text(bar.length?bar.join(', '):'None marked.');
  S.h('Comments',T); S.text(AT.comments.trim()||'–');
  S.h('Notes for the teacher',T); S.text(AT.notes.trim()||'–');
  saveBlob(d.output('blob'),`${name?name+' ':''}attendance and wellbeing report.pdf`).then(ok=>{ if(ok) toast("Downloaded. Store it securely and delete it from Downloads on shared computers."); });
}

/* ===== Session timer: 25 or 45 minute colour wheel. Full screen, or minimised to a corner that stays on every page. Nothing is saved. ===== */
const TM_GO='#3DDC84', TM_ZONES={25:[[5,'#FF8A3D','5 minutes left!']],45:[[15,'#FF8A3D','15 minutes left!'],[5,'#FF4FA3','Last 5!']]};

function tmWheelSVG(cls){ const T=TM.total, z=tmZone(), full=cls==='full';

const LEAF_N=14;
function leafEl(dir,W,front,back,ghost){
  const w=W/LEAF_N; let inner='';
  for(let i=LEAF_N-1;i>=0;i--){
    const fo = dir>0 ? -(i*w) : -(W-(i+1)*w), bo = dir>0 ? -(W-(i+1)*w) : -(i*w);
    const pos = i ? (dir>0?`left:${w}px`:`left:${-w}px`) : (dir>0?'left:0':`left:${W-w}px`);
    inner = `<div class="strip" style="width:${w+0.8}px;${pos}"><div class="sf lf-f"><div class="page ${front.c}" style="width:${W}px;left:${fo}px">${front.h}</div><i class="shade"></i></div><div class="sf lf-b"><div class="page ${back.c}" style="width:${W}px;left:${bo}px">${back.h}</div><i class="shade"></i></div>${inner}</div>`;
  }
  const el=document.createElement('div'); el.className='leaf2 '+(dir>0?'next':'prev')+(ghost?' ghost':''); el.setAttribute('aria-hidden','true'); el.innerHTML=inner;
  el._s=[...el.querySelectorAll('.strip')].map(st=>({st, f:st.querySelector(':scope > .lf-f > .shade'), b:st.querySelector(':scope > .lf-b > .shade')}));
  el._w=w; el._dir=dir; return el;
}
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function leafPose(el,p){
  const th=180*easeIO(p), c=82*Math.pow(Math.sin(Math.PI*p),1.15), d=el._dir; let prev=0, X=0;
  el._s.forEach((o,i)=>{ const f=i/(LEAF_N-1), T=Math.min(180,Math.max(0,th+c*Math.pow(f,1.7))), a=T-prev; prev=T;
    o.st.style.transform=`rotateY(${d>0?-a:a}deg)`;
    const r=T*Math.PI/180, sh=Math.sin(r);
    o.f.style.opacity=(sh*(.08+.3*f)+ (T>90? .1:0)).toFixed(3);
    o.b.style.opacity=(sh*(.05+.16*(1-f))).toFixed(3);
    X+=el._w*Math.cos(r); });
  return X;
}
function castPose(sp,dir,X,p){
  const W=sp.clientWidth/2, k=Math.sin(Math.PI*p), cl=sp.querySelector('.cast-clip.l .cast'), cr=sp.querySelector('.cast-clip.r .cast'); if(!cl) return;
  const show=(el,left,cls)=>{ el.className='cast '+cls; el.style.left=left+'px'; el.style.opacity=k.toFixed(3); };
  cl.style.opacity=0; cr.style.opacity=0;
  if(dir>0){ if(X>=0) show(cr,X,'toR'); else show(cl,W+X-110,'toL'); }
  else { if(X>=0) show(cl,W-X-110,'toL'); else show(cr,-X,'toR'); }
}
/* Sets up a turn and returns a controller: set(p) poses it, done(true) lands it, done(false) lets it fall back. */
function startTurn(to){
  to = Math.max(0, Math.min(TOTAL, to));
  if(to===pg || turning) return null;
  const sp=document.getElementById('spread'); if(!sp) return null;
  const old=pg, dir=to>pg?1:-1, from=spreadHTML(pg), next=spreadHTML(to), jump=Math.abs(to-pg);
  const L=sp.querySelector(':scope > .pg-l'), R=sp.querySelector(':scope > .pg-r');
  turning=true; pg=to; ready=false;
  const W=sp.clientWidth/2;
  const front = dir>0 ? {c:'pg-r '+(from.rc||''),h:from.r} : {c:'pg-l '+(from.lc||''),h:from.l};
  const back  = dir>0 ? {c:'pg-l '+(next.lc||''),h:next.l} : {c:'pg-r '+(next.rc||''),h:next.r};
  const leaf=leafEl(dir,W,front,back,false);
  const ghosts=[]; for(let g=0;g<Math.min(3,jump-1);g++) ghosts.push(leafEl(dir,W,{c:dir>0?'pg-r':'pg-l',h:''},{c:dir>0?'pg-l':'pg-r',h:''},true));
  if(dir>0){ R.className=`page pg-r ${next.rc||''}`; R.innerHTML=next.r; } else { L.className=`page pg-l ${next.lc||''}`; L.innerHTML=next.l; }
  if(dir>0 && from.rc==='cover-r') sp.classList.remove('is-cover');
  if(to===0) sp.classList.add('is-cover');
  sp.insertAdjacentHTML('beforeend','<div class="cast-clip l"><i class="cast"></i></div><div class="cast-clip r"><i class="cast"></i></div>');
  ghosts.forEach(gh=>{ sp.appendChild(gh); leafPose(gh,0); });
  sp.appendChild(leaf); leafPose(leaf,0);
  const cnt=document.getElementById('fbcount'); if(cnt) cnt.textContent=countLabel();
  const ctl={dir, p:0, ghosts,
    set(p){ ctl.p=p; const X=leafPose(leaf,p); castPose(sp,dir,X,p);
      ghosts.forEach((gh,gi)=>leafPose(gh,Math.max(0,Math.min(1,(p-.12*(gi+1))/(1-.12*(gi+1)))))); },
    done(ok){ if(!ok){ pg=old; const c2=document.getElementById('fbcount'); if(c2) c2.textContent=countLabel(); }
      sp.innerHTML=spreadInner(); sp.classList.toggle('is-cover', pg===0); turning=false; }};
  return ctl;
}
function animateTurn(ctl,toP,ms,after){
  const p0=ctl.p, t0=performance.now();
  const tick=now=>{ const t=Math.min(1,(now-t0)/ms); ctl.set(p0+(toP-p0)*t); if(t<1) requestAnimationFrame(tick); else after&&after(); };
  requestAnimationFrame(tick);
}
function turn(to){
  to = Math.max(0, Math.min(TOTAL, to));
  if(to===pg || turning) return;
  const sp=document.getElementById('spread');
  if(!sp || calm() || matchMedia('(max-width: 820px)').matches){
    pg=to; ready=false; const cnt=document.getElementById('fbcount'); if(cnt) cnt.textContent=countLabel(); if(!sp) return;
    sp.classList.remove('flipin'); void sp.offsetWidth; sp.innerHTML=spreadInner(); sp.classList.toggle('is-cover', pg===0); if(!calm()) sp.classList.add('flipin'); return;
  }
  const jump=Math.abs(to-pg), ctl=startTurn(to); if(!ctl) return;
  animateTurn(ctl,1,jump>1?1350:1150,()=>ctl.done(true));
}
/* Grab a page corner and drag it over */
let fbDrag=null, fbDragged=false;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.book .corner'); if(!c||e.button>0||calm()||matchMedia('(max-width: 820px)').matches||turning) return;
  fbDrag={x:e.clientX, dir:+c.dataset.fb, ctl:null, id:e.pointerId, el:c};
});
document.addEventListener('pointermove',e=>{
  if(!fbDrag||e.pointerId!==fbDrag.id) return;
  const dx=e.clientX-fbDrag.x;
  if(!fbDrag.ctl){ if(Math.abs(dx)<8) return; fbDrag.ctl=startTurn(pg+fbDrag.dir); if(!fbDrag.ctl){fbDrag=null;return;}
    try{ sx=null; }catch(_){} document.getElementById('book')?.classList.add('dragging'); }
  const sp=document.getElementById('spread'), r=sp.getBoundingClientRect();
  const p = fbDrag.dir>0 ? (r.right-e.clientX)/r.width : (e.clientX-r.left)/r.width;
  fbDrag.ctl.set(Math.max(0,Math.min(.98,p)));
});
const fbUp=e=>{
  if(!fbDrag||e.pointerId!==fbDrag.id) return;
  const d=fbDrag; fbDrag=null; document.getElementById('book')?.classList.remove('dragging');
  if(!d.ctl) return; fbDragged=true; setTimeout(()=>fbDragged=false,350);
  const ok=d.ctl.p>.3; animateTurn(d.ctl, ok?1:0, Math.max(260, 900*(ok?1-d.ctl.p:d.ctl.p)), ()=>d.ctl.done(ok));
};
document.addEventListener('pointerup',fbUp); document.addEventListener('pointercancel',fbUp);
document.addEventListener('click',e=>{ if(fbDragged&&e.target.closest('.book')){ e.stopPropagation(); e.preventDefault(); fbDragged=false; } },true);

    dragMoved=true; drag.ghost=drag.el.cloneNode(true); drag.ghost.classList.add('ghost-drag'); document.body.appendChild(drag.ghost); }

  else para('Available on request');
  return d.output('blob');
}
let downloadsNS;

  }

}

/* ===== LUNCH mode: 1:00 to 1:30pm on school days, by this device's clock. Hard to skip on purpose. Nothing is saved. ===== */
const LU={start:13*60, mins:30, skipDay:'', preview:0};
const LU_LINES=["Eat something.","Drink some water.","Step outside for a bit.","Phone down. Eyes off screens.","Nobody needs you for 30 minutes.","You can't pour from an empty cup.","Stretch. Shoulders down.","This is part of the job too."];
function luNow(){ const d=new Date(); return {d, min:d.getHours()*60+d.getMinutes()+d.getSeconds()/60, day:d.toDateString(), wk:d.getDay()>=1&&d.getDay()<=5}; }
function luActive(){ if(LU.preview&&Date.now()<LU.preview) return true; const n=luNow(); return n.wk&&n.min>=LU.start&&n.min<LU.start+LU.mins&&LU.skipDay!==n.day; }
function luLeftMs(){ if(LU.preview&&Date.now()<LU.preview) return LU.preview-Date.now(); const n=luNow(); return Math.max(0,(LU.start+LU.mins-n.min)*60000); }
function luCheck(){
  const on=luActive(), el=document.getElementById('lunch');
  if(on&&!el){ document.body.insertAdjacentHTML('beforeend',`<div class="lunch" id="lunch" role="dialog" aria-label="Lunch break">
    <span class="lu-blob a"></span><span class="lu-blob b"></span><span class="lu-blob c"></span>
    <div class="lu-in"><span class="lu-kick">Break time</span><h2 class="lu-h">LUNCH</h2>
      <p class="lu-left">Back at <b id="luBack"></b> · <span id="luLeft"></span> to go</p>
      <p class="lu-line" id="luLine">${LU_LINES[0]}</p></div>
    <button class="lu-skip" id="luSkip" aria-label="Hold for 5 seconds to work through lunch"><i></i><span>Hold to work through lunch</span></button></div>`); document.body.classList.add('lunch-on'); luLineIx=0; luStage=0; luSpot=-1; }
  if(!on&&el){ el.classList.add('out'); setTimeout(()=>el.remove(),600); document.body.classList.remove('lunch-on'); }
  if(on){ const ms=luLeftMs(), m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60; const back=new Date(Date.now()+ms);
    const a=document.getElementById('luLeft'), b=document.getElementById('luBack'); if(a) a.textContent=`${m}:${String(s).padStart(2,'0')}`; if(b) b.textContent=back.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
}
let luLineIx=0, luHold=0;
setInterval(luCheck,1000); setInterval(()=>{ const l=document.getElementById('luLine'); if(!l) return; luLineIx=(luLineIx+1)%LU_LINES.length; l.classList.remove('in'); void l.offsetWidth; l.textContent=LU_LINES[luLineIx]; l.classList.add('in'); },9000);
const LU_STAGES=[["Hold to work through lunch",null],["Do you really need to work through lunch?","Hmm. Suspicious."],["Last chance. Are you SURE?","Your sandwich is crying."]];
const LU_SPOTS=[[4,6],[72,6],[4,80],[66,80],[36,88],[36,4]];
let luStage=0, luSpot=-1;
function luStageSet(n){ luStage=n; const b=document.getElementById('luSkip'); if(!b) return; const [label,quip]=LU_STAGES[n];
  b.querySelector('span').textContent=label; b.classList.toggle('moved',n>0); b.classList.remove('jump'); void b.offsetWidth; b.classList.add('jump');
  if(n>0){ let k; do{ k=Math.floor(Math.random()*LU_SPOTS.length); }while(k===luSpot); luSpot=k; const W=innerWidth, H=innerHeight, bw=b.offsetWidth, bh=b.offsetHeight; b.style.left=Math.max(12,Math.min(W-bw-12,LU_SPOTS[k][0]/100*W))+'px'; b.style.top=Math.max(12,Math.min(H-bh-12,LU_SPOTS[k][1]/100*H))+'px'; }
  if(quip){ const l=document.getElementById('luLine'); if(l){ l.textContent=quip; l.classList.remove('in'); void l.offsetWidth; l.classList.add('in'); } } }
function luHoldStart(e){ if(!e.target.closest('#luSkip')) return; e.preventDefault(); const b=document.getElementById('luSkip'); b.classList.remove('holding'); void b.offsetWidth; b.classList.add('holding'); clearTimeout(luHold);
  luHold=setTimeout(()=>{ b.classList.remove('holding');
    if(luStage<LU_STAGES.length-1){ luStageSet(luStage+1); return; }
    LU.skipDay=luNow().day; LU.preview=0; luStage=0; luCheck(); toast('Fine. Lunch skipped for today. At least eat something at your desk.'); },5000); }
function luHoldEnd(){ clearTimeout(luHold); document.getElementById('luSkip')?.classList.remove('holding'); }
document.addEventListener('pointerdown',luHoldStart); document.addEventListener('pointerup',luHoldEnd); document.addEventListener('pointercancel',luHoldEnd); document.addEventListener('pointerleave',luHoldEnd);
